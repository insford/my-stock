name: Market Price & History DB Sync

on:
  schedule:
    # 월~금 프리마켓(08:00 KST) ~ 애프터마켓(20:00 KST) 동안 30분 마다 실행
    # UTC 기준: 23:00 (전일) ~ 11:00 (당일) -> KST 기준 08:00 ~ 20:00
    - cron: '*/30 23,0-11 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Live Market Price Updater
        run: python update_prices.py

      - name: Run Market History DB Updater
        run: python update_history.py --update

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update live market prices & history sqlite db [skip ci]"
          file_pattern: "guide/data/live_market.js guide/data/market_history.db"
