name: Market Price & History DB Sync

on:
  schedule:
    # 1. 국내 증시 개장 전 세션 (KST 08:00 ~ 08:30) - 월~금 (UTC 일~목 23:00)
    - cron: '*/30 23 * * 0-4'

    # 2. 국내 증시 정규장 & 장후 시간외 세션 (KST 09:00 ~ 19:00) - 월~금 (UTC 월~금 00:00 ~ 10:00)
    - cron: '*/30 0-10 * * 1-5'

    # 3. 해외(미국) 증시 정규장 & 장 마감 종가 정산 세션 (KST 22:00 ~ 익일 07:00) - 월 밤 ~ 토 아침 (UTC 월~금 13:00 ~ 22:00)
    #    - 미국 본장 실시간 시세 수집 (서머타임 KST 22:30~05:00 / 동절기 KST 23:30~06:00)
    #    - ★ 해외계좌 장 마감 종가 확정: KST 05:00 (서머타임) / KST 06:00 (동절기)
    #    - ★ 애프터마켓 및 최종 일별 DB 정산: KST 06:30 ~ 07:00 (금요일 미국장 -> 토요일 아침 최종 정산 포함)
    - cron: '*/30 13-22 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Live Market Price Updater
        run: python update_prices.py

      - name: Run Market History DB Updater
        run: python update_history.py --update

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update live market prices & history sqlite db [skip ci]"
          file_pattern: "guide/data/live_market.js guide/data/market_history.db"
