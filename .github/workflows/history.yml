name: Daily Market History DB Update

on:
  schedule:
    # 월~금 한국시간 15:05 (UTC 06:05), 20:05 (UTC 11:05) — 일 2회 자동 수집 (15시 장마감 직후 & 20시 최종 확정종가)
    # monitor.yml(10분 주기)과의 Push 충돌 방지를 위해 5분 오프셋 적용
    - cron: '5 6,11 * * 1-5'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update-history-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run History DB Updater
        run: python update_history.py --update

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily market history sqlite db [skip ci]"
          file_pattern: "guide/data/market_history.db"
